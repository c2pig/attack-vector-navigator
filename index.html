let activeCategory = 'all';
let searchQuery = '';

function renderCards() {
  const grid = document.getElementById('scenario-grid');
  const filtered = SCENARIO_MANIFEST.filter(s => {
    if (activeCategory !== 'all' && s.category !== activeCategory) return false;
    if (searchQuery) {
      const haystack = [s.title, s.description, s.source, ...s.tags, ...(s.mitre||[])].join(' ').toLowerCase();
      return haystack.includes(searchQuery);
    }
    return true;
  }).sort((a,b) => (a.order||99) - (b.order||99));

  grid.innerHTML = filtered.map(s => {
    const indHtml = (name, val) => {
      const segs = Array.from({length:10},(_,i) => `<div class="sc-ind-seg${i<val?' filled':''}${i<val&&val>=7?' high':''}"></div>`).join('');
      return `<div class="sc-ind"><span class="sc-ind-label">${name}</span><div class="sc-ind-bar">${segs}</div></div>`;
    };
    return `<a class="scenario-card" href="simulator.html?scenario=${s.id}">
      <span class="sc-order">#${s.order||''}</span>
      <div class="sc-category">${s.category.replace(/-/g,' ')}</div>
      <div class="sc-title">${s.title}</div>
      <div class="sc-source">${s.source} · ${s.designed_by}</div>
      <div class="sc-desc">${s.description}</div>
      <div class="sc-indicators">
        ${indHtml('Difficulty',s.indicators.difficulty)}
        ${indHtml('Cog. Load',s.indicators.cognitive_load)}
        ${indHtml('Enum Depth',s.indicators.enumeration_depth)}
        ${indHtml('Rabbit Holes',s.indicators.rabbit_hole_risk)}
        ${indHtml('Time Press.',s.indicators.time_pressure)}
      </div>
      <div class="sc-meta-row">
        ${s.env.machines}M · ${s.env.networks}N · ${s.env.win}W ${s.env.lin}L
        ${s.env.ad?' · AD':''}${s.env.pivot?' · PIVOT':''}
        · ${(s.freq||'').toUpperCase()} · PEN-200: ${(s.pen200||[]).map(m=>'M'+m).join(' ')}
      </div>
      <div class="sc-tags">${s.tags.slice(0,8).map(t=>`<span class="sc-tag">${t}</span>`).join('')}${s.tags.length>8?`<span class="sc-tag">+${s.tags.length-8}</span>`:''}</div>
    </a>`;
  }).join('');
}

document.getElementById('category-tabs').addEventListener('click', e => {
  const tab = e.target.closest('.cat-tab');
  if (!tab) return;
  document.querySelectorAll('.cat-tab').forEach(t => t.classList.remove('active'));
  tab.classList.add('active');
  activeCategory = tab.dataset.cat;
  renderCards();
});

document.getElementById('landing-search').addEventListener('input', e => {
  searchQuery = e.target.value.trim().toLowerCase();
  renderCards();
});

renderCards();
</script>
